# 기존 기본 시트/관리자/시험감독/gcp_service_account Secrets는 유지하세요.
# [school_sheets]가 이미 있으면 중복 추가하지 말고 기존 섹션을 수정하세요.
# 확장 시트를 기존 서비스 계정 이메일에 편집자로 공유한 뒤 주소만 넣으면 됩니다.
# Apps Script, Gateway_url, Gateway_shared_key는 필요하지 않습니다.
[school_sheets]
Gogyohak_sheet = ""   # 확장 Google 스프레드시트 URL 또는 ID
Idongban_sheet = ""   # 비워두면 위 문서 공유
Operations_sheet = "" # 비워두면 위 문서 공유
Semester_sheet = ""   # 비워두면 위 문서 공유 (이 항목만 입력해도 됨)

# 선택: 학년도·학기는 화면에서도 선택할 수 있습니다.
# Academic_year = 2026
# Semester = 1
# School_id = "기존학교ID" # 기존 데이터가 있으면 기존 학교 ID 유지

# 기존 [credit] 게이트웨이가 있으면 하위호환을 위해 그 연결을 유지합니다.
# 기존 게이트웨이 데이터가 없는 문서만 명시적으로 direct로 전환할 수 있습니다.
# Storage_mode = "direct"

# 학교 표시명: 로그인·메뉴·인쇄·Excel·새 학기 기초자료에 사용합니다.
[school]
name = "우리학교"
# 기존 최상위 NEIS_API_KEY도 지원합니다. 이 섹션에 같이 넣어도 됩니다.
neis_api_key = "" # 기존 나이스 API 키
# 교육청코드·학교코드는 학교명으로 자동 조회합니다. 직접 입력하지 않습니다.
